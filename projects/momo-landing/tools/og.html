<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:P;src:url(woff2/PretendardVariable.woff2) format("woff2-variations");font-weight:100 900}
*{margin:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{font-family:P,sans-serif;background:radial-gradient(60% 70% at 50% 34%,#1d3b3a 0%,#0b1a2c 48%,#050b16 100%);position:relative;color:#fff}
body::before{content:"";position:absolute;inset:0;background:radial-gradient(38% 40% at 50% 40%,rgba(241,207,126,.28),transparent 70%)}
body::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:linear-gradient(90deg,#3ddc97,#f1cf7e,#3ddc97)}
.stamp{position:absolute;left:50%;top:14px;width:520px;transform:translateX(-50%) rotate(-2deg);filter:drop-shadow(0 22px 30px rgba(0,0,0,.6));-webkit-mask-image:linear-gradient(180deg,#000 80%,transparent 100%)}
.copy{position:absolute;left:0;right:0;bottom:44px;text-align:center}
.k{font-size:22px;font-weight:700;letter-spacing:.14em;color:#3ddc97;margin-bottom:12px}
h1{font-size:68px;font-weight:900;letter-spacing:-.04em;line-height:1.05;text-shadow:0 6px 24px rgba(0,0,0,.6)}
h1 em{font-style:normal;background:linear-gradient(90deg,#3ddc97,#2bc4c9 55%,#8fb4ff);-webkit-background-clip:text;color:transparent}
</style></head><body>
<img class="stamp" src="momo-stamp-900.webp">
<div class="copy"><p class="k">19년 탈모 1등 가이드 모모형 PICK</p><h1>전국 탈모 진료 <em>전문의 리스트</em></h1></div>
</body></html>
